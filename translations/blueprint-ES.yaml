blueprint:
  name: Script de Control Velux SML
  domain: script
  input:
    switch_1:
      name: Interruptor 1
      description: La primera entidad de interruptor del Sonoff CH4 Pro conectada a esta persiana.
      selector:
        entity:
          domain: switch
    switch_2:
      name: Interruptor 2
      description: La segunda entidad de interruptor del Sonoff CH4 Pro conectada a esta persiana.
      selector:
        entity:
          domain: switch
    position:
      name: Posición
      description: La entidad input_number creada utilizada para rastrear la posición de esta persiana.
      selector:
        entity:
          domain: input_number
    time_to_open_close:
      name: Tiempo para abrir o cerrar completamente
      description: El tiempo en segundos que tarda en abrirse o cerrarse completamente la persiana.
      default: 32
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: seconds
    reverse_direction:
      name: Invertir dirección
      description: (Opcional) Habilite esto si encender ambos interruptores cierra esta persiana y apagarlos la abre. Esto solo debería ser un problema si los cables de la persiana Velux SML se conectaron en el orden incorrecto al Sonoff CH4 Pro.
      default: false
      selector:
        boolean: {}

variables:
  switch_1: !input switch_1
  switch_2: !input switch_2
  position: !input position
  time_to_open_close: !input time_to_open_close
  reverse_direction: !input reverse_direction

fields:
  action:
    name: Action
    description: Action to perform
    required: true
    selector:
      select:
        multiple: false
        options:
          - Open
          - Close
          - Stop
          - Position
  requested_position:
    name: Requested Position
    description: Target position (only used when Action is equal to Position)
    required: false
    selector:
      number:
        min: 0
        max: 100
        step: 1

mode: parallel
max: 10

sequence:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ action == 'Open' }}"
        sequence:
          - action: >-
              {% if reverse_direction %} switch.turn_off {% else %} switch.turn_on {% endif %}
            target:
              entity_id:
                - !input switch_1
                - !input switch_2
          - delay:
              hours: 0
              minutes: 0
              seconds: 1
              milliseconds: 0
          - repeat:
              while:
                - condition: numeric_state
                  entity_id: !input position
                  below: 100
                - condition: template
                  value_template: |-
                    {% set state1 = states(switch_1) %}
                    {% set state2 = states(switch_2) %}
                    {% if state1 == 'on' and state2 == 'off' %}
                      false
                    {% elif state1 == 'off' and state2 == 'on' %}
                      false
                    {% else %}
                      true
                    {% endif %}
              sequence:
                - action: input_number.increment
                  target:
                    entity_id: !input position
                - delay:
                    hours: 0
                    minutes: 0
                    seconds: 0
                    milliseconds: "{{ (time_to_open_close | int * 10) | round(0, 'ceil') }}"
      - conditions:
          - condition: template
            value_template: "{{ action == 'Close' }}"
        sequence:
          - action: >-
              {% if reverse_direction %} switch.turn_on {% else %} switch.turn_off {% endif %}
            target:
              entity_id:
                - !input switch_1
                - !input switch_2
          - delay:
              hours: 0
              minutes: 0
              seconds: 1
              milliseconds: 0
          - repeat:
              while:
                - condition: numeric_state
                  entity_id: !input position
                  above: 0
                - condition: template
                  value_template: |-
                    {% set state1 = states(switch_1) %}
                    {% set state2 = states(switch_2) %}
                    {% if state1 == 'on' and state2 == 'off' %}
                      false
                    {% elif state1 == 'off' and state2 == 'on' %}
                      false
                    {% else %}
                      true
                    {% endif %}
              sequence:
                - action: input_number.decrement
                  target:
                    entity_id: !input position
                - delay:
                    hours: 0
                    minutes: 0
                    seconds: 0
                    milliseconds: "{{ (time_to_open_close | int * 10) | round(0, 'ceil') }}"
      - conditions:
          - condition: template
            value_template: "{{ action == 'Stop' }}"
        sequence:
          - action: switch.toggle
            target:
              entity_id: !input switch_2
      - conditions:
          - condition: template
            value_template: "{{ action == 'Position' }}"
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {{
                  states(position)|int()
                  < requested_position }}
            then:
              - action: >-
                  {% if reverse_direction %} switch.turn_off {% else %} switch.turn_on {% endif %}
                target:
                  entity_id:
                    - !input switch_1
                    - !input switch_2
              - delay:
                  hours: 0
                  minutes: 0
                  seconds: 1
                  milliseconds: 0
              - repeat:
                  while:
                    - condition: template
                      value_template: >-
                        {{
                        states(position)|int()
                        != requested_position }}
                  sequence:
                    - action: input_number.increment
                      target:
                        entity_id: !input position
                    - delay:
                        hours: 0
                        minutes: 0
                        seconds: 0
                        milliseconds: "{{ (time_to_open_close | int * 10) | round(0, 'ceil') }}"
              - action: switch.toggle
                target:
                  entity_id: !input switch_2
            else:
              - action: >-
                  {% if reverse_direction %} switch.turn_on {% else %} switch.turn_off {% endif %}
                target:
                  entity_id:
                    - !input switch_1
                    - !input switch_2
              - delay:
                  hours: 0
                  minutes: 0
                  seconds: 1
                  milliseconds: 0
              - repeat:
                  while:
                    - condition: template
                      value_template: >-
                        {{
                        states(position)|int()
                        != requested_position }}
                  sequence:
                    - action: input_number.decrement
                      target:
                        entity_id: !input position
                    - delay:
                        hours: 0
                        minutes: 0
                        seconds: 0
                        milliseconds: "{{ (time_to_open_close | int * 10) | round(0, 'ceil') }}"
              - action: switch.toggle
                target:
                  entity_id: !input switch_2
